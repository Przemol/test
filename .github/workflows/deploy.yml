name: Deploy to Wasmer Edge

on:
  push:
    branches: [main, master, "claude/*"]
  workflow_dispatch:
    inputs:
      wasmer_token:
        description: "Wasmer API token (for manual runs; prefer using the WASMER_TOKEN secret)"
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ inputs.wasmer_token || secrets.WASMER_TOKEN }}
        run: wasmer deploy --non-interactive
