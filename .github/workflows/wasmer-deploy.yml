name: Deploy to Wasmer Edge

on:
  push:
    branches: ['claude/rap-artist-landing-page-hfa9oo']
  workflow_dispatch:
    inputs:
      wasmer_token:
        description: 'Wasmer API token (used only when WASMER_TOKEN secret is not set)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mask token
        run: |
          TOKEN="${{ github.event.inputs.wasmer_token }}"
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
          fi

      - name: Install Wasmer CLI
        run: |
          curl -fsSL https://github.com/wasmerio/wasmer/releases/latest/download/wasmer-linux-amd64.tar.gz -o /tmp/wasmer.tar.gz
          mkdir -p "$HOME/.wasmer/bin"
          tar -xzf /tmp/wasmer.tar.gz -C "$HOME/.wasmer"
          echo "$HOME/.wasmer/bin" >> "$GITHUB_PATH"

      - name: Deploy to Wasmer Edge
        run: wasmer deploy --token "$WASMER_TOKEN" --owner Przemol --publish-package --non-interactive
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN != '' && secrets.WASMER_TOKEN || github.event.inputs.wasmer_token }}
